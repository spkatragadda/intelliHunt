name: "repo_reader"
description: "Read-only sandbox for reading repository files during security scans"

mode: ONCE
hostname: "sandbox"
time_limit: 30

rlimit_as_type: SOFT
rlimit_cpu_type: SOFT
rlimit_fsize: 64
rlimit_nofile: 32

clone_newnet: true
clone_newpid: true
clone_newns: true

mount {
    src: "/usr"
    dst: "/usr"
    is_bind: true
    rw: false
}

mount {
    src: "/lib"
    dst: "/lib"
    is_bind: true
    rw: false
}

mount {
    src: "/lib64"
    dst: "/lib64"
    is_bind: true
    rw: false
    mandatory: false
}

mount {
    src: "/bin"
    dst: "/bin"
    is_bind: true
    rw: false
}

mount {
    src: "/sbin"
    dst: "/sbin"
    is_bind: true
    rw: false
    mandatory: false
}

mount {
    dst: "/tmp"
    fstype: "tmpfs"
    rw: true
    options: "size=16777216"
}

mount {
    dst: "/dev"
    fstype: "tmpfs"
    rw: false
}

mount {
    src: "/dev/null"
    dst: "/dev/null"
    is_bind: true
    rw: true
}
