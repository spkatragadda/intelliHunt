services:

  postgres:
    image: postgres:16-alpine
    container_name: intellihunt-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-intellihunt}
      - POSTGRES_USER=${POSTGRES_USER:-intellihunt}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intellihunt} -d ${POSTGRES_DB:-intellihunt}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  neo4j:
    image: neo4j:5.26-community
    container_name: intellihunt-neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    ports:
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD} 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  django:
    build:
      context: .
      dockerfile: Dockerfile
      target: django
    container_name: intellihunt-django
    restart: unless-stopped
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=intelliHunt.settings
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/server
      - BEHIND_PROXY=true
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-intellihunt}
      - POSTGRES_USER=${POSTGRES_USER:-intellihunt}
      - NEO4J_BOLT_URL=bolt://neo4j:7687
    expose:
      - "8000"
    volumes:
      - ./logs:/app/server/logs
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(3); s.connect(('127.0.0.1',8000)); s.close()\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
      target: nextjs
    container_name: intellihunt-nextjs
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server.js"]
    ports:
      - "3000:3000"
    environment:
      - API_BASE_INTERNAL=http://django:8000
      - NODE_ENV=production
    depends_on:
      django:
        condition: service_healthy

networks:
  default:
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
