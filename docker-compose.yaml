services:

  django:
    build:
      context: .
      dockerfile: Dockerfile
      target: django
    container_name: intellihunt-django
    restart: unless-stopped
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=intelliHunt.settings
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/server
      - BEHIND_PROXY=true
    expose:
      - "8000"
    volumes:
      - ./logs:/app/server/logs
      - django_db:/app/server/db
    healthcheck:
      test:
        - CMD-SHELL
        - |
          python - <<'PY'
          import sys, urllib.request
          try:
            urllib.request.urlopen('http://localhost:8000/', timeout=3)
            sys.exit(0)
          except Exception:
            sys.exit(1)
          PY
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
      target: nextjs
    container_name: intellihunt-nextjs
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server.js"]
    ports:
      - "3000:3000"
    environment:
      - API_BASE_INTERNAL=http://django:8000
      - NODE_ENV=production
    depends_on:
      django:
        condition: service_healthy

networks:
  default:
    driver: bridge

volumes:
  django_db:
