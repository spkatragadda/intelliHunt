# /etc/nginx/sites-available/intellihunt.conf
#
# Reverse proxy for IntelliHunt running on Docker Compose.
#
# Architecture:
#   Cloudflare (SSL termination) → Nginx (port 80) → Next.js container (:3000)
#                                                   Next.js rewrites /api/* → Django (:8000, internal)
#
# Cloudflare handles HTTPS. Nginx only needs to listen on port 80.
# Cloudflare's "Full" SSL mode is recommended — it encrypts Cloudflare→EC2
# traffic too (using the origin certificate you generate in Cloudflare dashboard).
#
# Setup on EC2:
#   sudo cp nginx/intellihunt.conf /etc/nginx/sites-available/intellihunt
#   sudo ln -s /etc/nginx/sites-available/intellihunt /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# Trust Cloudflare's IP ranges so $http_cf_connecting_ip is reliable.
# Full list: https://www.cloudflare.com/ips/
# Keep these updated if Cloudflare adds new ranges.
geo $cloudflare_ip {
    default         0;
    # IPv4
    173.245.48.0/20  1;
    103.21.244.0/22  1;
    103.22.200.0/22  1;
    103.31.4.0/22    1;
    141.101.64.0/18  1;
    108.162.192.0/18 1;
    190.93.240.0/20  1;
    188.114.96.0/20  1;
    197.234.240.0/22 1;
    198.41.128.0/17  1;
    162.158.0.0/15   1;
    104.16.0.0/13    1;
    104.24.0.0/14    1;
    172.64.0.0/13    1;
    131.0.72.0/22    1;
    # IPv6
    2400:cb00::/32   1;
    2606:4700::/32   1;
    2803:f800::/32   1;
    2405:b500::/32   1;
    2405:8100::/32   1;
    2a06:98c0::/29   1;
    2c0f:f248::/32   1;
}

server {
    listen 80;
    server_name intellihunt.io www.intellihunt.io;

    # Only accept traffic from Cloudflare. Direct hits to the EC2 IP are dropped.
    # Remove this block if you need direct IP access during setup/debugging.
    if ($cloudflare_ip = 0) {
        return 444;
    }

    # Pass the real visitor IP from Cloudflare through to the app.
    real_ip_header    CF-Connecting-IP;

    # Forward the original scheme (https) so Django/Next.js know the request
    # arrived over TLS even though Nginx received plain HTTP from Cloudflare.
    proxy_set_header  X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header  X-Real-IP         $http_cf_connecting_ip;
    proxy_set_header  Host              $host;

    # Strip the X-Powered-By header that Next.js adds.
    proxy_hide_header X-Powered-By;

    # Allow ZIP repository uploads (up to 100 MB).
    client_max_body_size 100m;

    # Increase timeouts for long-running report/scan requests.
    proxy_read_timeout  180s;
    proxy_send_timeout  180s;

    # All traffic goes to the Next.js container.
    # /api/* is transparently rewritten to Django by Next.js internally.
    location / {
        proxy_pass         http://0.0.0.0:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }

    # Serve Next.js static assets with long-lived cache headers.
    location /_next/static/ {
        proxy_pass         http://0.0.0.0:3000;
        proxy_cache_valid  200 365d;
        add_header         Cache-Control "public, max-age=31536000, immutable";
    }
}
